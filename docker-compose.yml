# =============================================================================
# docker-compose.yml — Mini Blinkit ERP Platform
# =============================================================================
#
# ARCHITECTURAL DECISION: Docker Compose for local dev & CI
# WHY: Single command (`make up`) spins the entire stack — Postgres, Redis,
#      API, Celery worker, Flower — identically on any developer machine and
#      in CI. Eliminates "works on my machine" problems.
#
# ALTERNATIVE CONSIDERED: Podman Compose — rejected because Compose V2 (now
#      bundled with Docker Desktop) has better plugin ecosystem and the team
#      is already familiar with Docker tooling.
#
# SCALABILITY NOTE: This file targets LOCAL DEV ONLY.
#      Production uses individual Docker images pushed to ECR/GCR and
#      orchestrated by ECS/GKE. The Compose structure mirrors the production
#      service graph, making the transition straightforward.
#
# SECURITY NOTE:
#      - No secrets hardcoded. All credentials come from .env file.
#      - Services communicate over an internal bridge network (erp_network).
#        Only the API and Flower ports are exposed to the host.
#      - Postgres and Redis are NOT exposed externally in production.
#      - Health checks ensure dependent services wait for readiness
#        (prevents race conditions on startup).
#
# =============================================================================

version: "3.9"

# ── Named volumes ─────────────────────────────────────────────────────────────
# Named volumes persist data across container restarts.
# Bind mounts (./postgres-data) are avoided because volume drivers are
# portable across Linux, macOS, and Windows (via WSL2).
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_data:
    driver: local

# ── Internal network ──────────────────────────────────────────────────────────
# All services share a single bridge network. External traffic reaches only
# the API and Flower. Postgres/Redis are unreachable from outside.
networks:
  erp_network:
    driver: bridge

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────
  # WHY Postgres 16: Partial indexes, JSONB, advisory locks, window functions,
  # pg_partman for table partitioning — all needed for our analytics module.
  # WHY NOT MySQL: Lacks proper advisory lock semantics and partial index support.
  # WHY NOT MongoDB: Our domain is highly relational (PO → GRN → Inventory).
  postgres:
    image: postgres:16-alpine
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
      POSTGRES_USER: ${POSTGRES_USER:-erp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # SCRAM-SHA-256 is more secure than MD5 (Postgres default before 14)
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - erp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp_user} -d ${POSTGRES_DB:-erp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Redis 7 ──────────────────────────────────────────────────────────────
  # WHY Redis: Used as Celery broker AND result backend AND application cache.
  # Redis 7 brings Redis Functions, ACL v2 — better multi-tenant isolation.
  # WHY NOT RabbitMQ: Would require a separate cache store. Redis does both.
  # WHY NOT Kafka: Overkill for this scale; adds operational complexity.
  # SECURITY: requirepass enforced via env var. In production, use Redis AUTH
  # + TLS + ACLs to restrict which keys each service can access.
  redis:
    image: redis:7-alpine
    container_name: erp_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_password}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly no
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - erp_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  # WHY FastAPI: Native async/await, automatic OpenAPI docs, Pydantic v2 
  # integration, one of the fastest Python frameworks (benchmarked against
  # Django, Flask, Starlette). Type annotations enforce correctness at parse time.
  # WHY NOT Django REST Framework: Sync by default, heavier ORM, slower cold start.
  # WHY NOT Flask: No native async, requires more boilerplate for schemas.
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: erp_api
    restart: unless-stopped
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-erp_password}@postgres:5432/${POSTGRES_DB:-erp_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-supersecretkey_changeme_in_production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      - MEDIA_ROOT=/app/media
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - erp_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app
      --log-level info

  # ── Celery Worker ─────────────────────────────────────────────────────────
  # WHY Celery: Mature, battle-tested distributed task queue.
  # Handles: PDF generation (ReportLab), Excel exports (openpyxl),
  # 60-second stock reservation timeouts, email notifications.
  # WHY NOT asyncio background tasks: No persistence — if the API pod restarts,
  # in-flight tasks are lost. Celery tasks are durable via Redis persistence.
  # WHY NOT FastAPI BackgroundTasks: Same problem — not durable.
  # SCALABILITY: Add more workers by scaling this service:
  #   docker compose up --scale celery_worker=4
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: erp_celery_worker
    restart: unless-stopped
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-erp_password}@postgres:5432/${POSTGRES_DB:-erp_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-supersecretkey_changeme_in_production}
      - MEDIA_ROOT=/app/media
    volumes:
      - ./backend:/app
      - media_data:/app/media
    networks:
      - erp_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=default,pdf_generation,excel_export,stock_reservation

  # ── Celery Beat (Scheduled Tasks) ─────────────────────────────────────────
  # Handles periodic tasks: daily reports, stock alert emails, cleanup jobs.
  # NOTE: Only one Beat instance should run at a time — it is the scheduler.
  # In production, use celery-redbeat for distributed, Redis-backed scheduling
  # instead of the default file-based scheduler.
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: erp_celery_beat
    restart: unless-stopped
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-erp_user}:${POSTGRES_PASSWORD:-erp_password}@postgres:5432/${POSTGRES_DB:-erp_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-supersecretkey_changeme_in_production}
    volumes:
      - ./backend:/app
    networks:
      - erp_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A app.workers.celery_app beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # ── Flower (Celery Monitoring) ────────────────────────────────────────────
  # WHY Flower: Real-time monitoring of Celery tasks — see queues, retries,
  # failures without touching the command line.
  # In production, place Flower behind OAuth2 proxy (e.g., oauth2-proxy + Nginx).
  flower:
    image: mher/flower:2.0
    container_name: erp_flower
    restart: unless-stopped
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/1
      - FLOWER_PORT=5555
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-flower_password}
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    networks:
      - erp_network
    depends_on:
      - redis
      - celery_worker
