    <!-- Preconnect to Google Fonts for faster load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      WHY Inter font:
        Inter is designed for screens — optimized letter spacing, x-height,
        and legibility for UI text at small sizes. Used by Notion, Linear,
        Vercel, and most premium SaaS products. Dramatically better than
        system fonts for professional appearance.

      WHY JetBrains Mono:
        Monospace font for barcode values, SKUs, order numbers — ensures
        digits are fixed-width and distinguishable (0 vs O, 1 vs l).
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

  </body>
